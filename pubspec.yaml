name: hadgaly
description: Offline-first personal finance, accounts and reliable local balances.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.13.7 <3.14.0'
  flutter: '3.47.9'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  drift: 2.35.3
  drift_flutter: 0.3.1
  cupertino_icons: 1.0.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.2
  build_runner: 2.17.1
flutter:
  default-flavor: production
  uses-material-design: true
  assets:
    - path: test/fixtures/stage1_completed_v1.fixture
      flavors: [sandbox]
    - path: test/fixtures/stage1_partial_v1.fixture
      flavors: [sandbox]
  fonts:
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa.ttf
