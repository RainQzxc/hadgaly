name: hadgaly
description: Offline-first personal finance, accounts and reliable local balances.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.13.7 <3.14.0'
  flutter: '3.47.9'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  drift: 2.35.3
  drift_flutter: 0.3.1
  cupertino_icons: 1.0.9
  crypto: 3.0.8
  path_provider: 2.1.6
  sqlite3: 3.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.2
  build_runner: 2.17.1
flutter:
  default-flavor: production
  uses-material-design: true
  assets:
    - assets/brand/hadgaly-wordmark.png
    - assets/fonts/GoogleSansFlex-OFL.txt
    - assets/fonts/GoogleSansFlex-TRADEMARKS.md
    - assets/fonts/NotoSans-OFL.txt
    - path: test/fixtures/stage1_completed_v1.fixture
      flavors: [sandbox]
    - path: test/fixtures/stage1_partial_v1.fixture
      flavors: [sandbox]
    - path: test/fixtures/stage2_v2.fixture
      flavors: [sandbox]
    - path: test/fixtures/stage3_v3.fixture
      flavors: [sandbox]
  fonts:
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
