publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.13.7 <3.14.0'
  flutter: '3.47.9'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  drift: 2.35.3
